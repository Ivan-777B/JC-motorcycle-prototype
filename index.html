<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>MotorCare – Repair Manager</title>
  <link rel="icon" type="image/jpeg" href="../logo/logo.jpg">
  <link rel="stylesheet" href="./style.css">
  <script>
    try {
      var rawSession = localStorage.getItem("moto1_session");
      if (rawSession) {
        var s = JSON.parse(rawSession);
        if (s && s.userId) {
          document.documentElement.classList.add("has-session");
        }
      }
      // Restore laptop collapsed sidebar preference before first paint to prevent flash
      var isDesktopSidebar = window.matchMedia
        ? window.matchMedia("(min-width: 900px)").matches
        : window.innerWidth >= 900;
      if (isDesktopSidebar && localStorage.getItem("moto1_sidebar") === "collapsed") {
        document.documentElement.classList.add("sidebar--collapsed");
      }
    } catch (e) {}
  </script>
</head>
<body class="logged-out">
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo-tile">
        <img class="login-logo-img" src="../logo/logo.jpg" alt="MotoCare logo" onerror="if(this.dataset.tried!=='1'){this.dataset.tried='1';this.src='logo/logo.jpg';}else if(this.dataset.tried!=='2'){this.dataset.tried='2';this.src='logo.jpg';}else{this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='';}">
        <i style="display: none;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><path d="M15 6h-3l-3 6.5h6l2-3.5h3"></path><path d="M9 12.5l-3.5 5"></path><path d="M18.5 14v3.5"></path></svg></i>
      </div>
      <h1 class="login-title">MotoCare OS</h1>
      <div class="login-sub">SHOP MANAGEMENT SYSTEM</div>
      <p class="login-tagline">Sign in to your account</p>
    </div>

    <div class="login-field">
      <label for="login-email" class="login-label">EMAIL</label>
      <div class="login-input-wrap">
        <span class="login-input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </span>
        <input
          id="login-email"
          class="login-input login-input-with-icon"
          type="text"
          placeholder="Choose or type an email"
          autocomplete="off"
          autofocus
          role="combobox"
          aria-expanded="false"
          aria-controls="login-dropdown"
          aria-autocomplete="list"
          onfocus="openLoginDropdown()"
          onclick="openLoginDropdown()"
          oninput="onLoginEmailInput(this.value)"
          onkeydown="onLoginEmailKeydown(event)"
        >
        <div id="login-dropdown" class="login-dropdown" role="listbox" style="display: none;"></div>
      </div>
      <div id="login-err" class="login-err" role="alert"></div>
    </div>

    <div class="login-field">
      <label for="login-pass-mock" class="login-label">PASSWORD (OPTIONAL)</label>
      <input
        id="login-pass-mock"
        class="login-input login-input-disabled"
        type="password"
        placeholder="Not required for prototype"
        disabled
        tabindex="-1"
      >
    </div>

    <button type="button" id="login-btn" class="login-btn" onclick="login()">Sign In</button>

    <div class="login-divider"></div>
    <div class="login-proto-note">Prototype mode: select a role to continue.</div>
  </div>
  <footer class="login-footer" id="login-footer">
    © <span id="login-year"></span> MotoCare OS · Prototype
  </footer>
</div>

<header id="app-header" class="app-header" role="banner">
  <div class="app-header-left">
    <button
      type="button"
      id="app-menu-btn"
      class="app-menu-btn"
      onclick="toggleAppDrawer()"
      title="Main menu"
      aria-label="Main menu"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <svg class="app-icon-menu" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <svg class="app-icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="app-header-brand">
      <img class="app-header-logo" src="../logo/logo.jpg" alt="MotoCare logo" onerror="if(this.dataset.tried!=='1'){this.dataset.tried='1';this.src='logo/logo.jpg';}else if(this.dataset.tried!=='2'){this.dataset.tried='2';this.src='logo.jpg';}else{this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='';}">
      <i class="app-header-logo-fallback" style="display: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><path d="M15 6h-3l-3 6.5h6l2-3.5h3"></path><path d="M9 12.5l-3.5 5"></path><path d="M18.5 14v3.5"></path></svg></i>
      <span class="app-header-title">MotoCare</span>
    </div>
  </div>
  <div id="app-header-right" class="app-header-right"></div>
</header>
<div id="app-scrim" class="app-scrim" onclick="closeAppDrawer()" aria-hidden="true"></div>

<button
  type="button"
  id="btn-mobile-menu"
  class="btn-mobile-menu"
  onclick="openSidebarDrawer()"
  title="Open menu"
  aria-label="Open menu"
  aria-expanded="false"
  aria-controls="sidebar"
>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </svg>
</button>
<div id="sidebar-backdrop" class="sidebar-backdrop" onclick="closeSidebarDrawer()" aria-hidden="true"></div>

<aside id="sidebar" aria-label="Sidebar navigation" aria-hidden="true">
  <div class="logo-row">
    <div class="logo">
      <img class="sidebar-logo-img" src="../logo/logo.jpg" alt="MotoCare logo" onerror="if(this.dataset.tried!=='1'){this.dataset.tried='1';this.src='logo/logo.jpg';}else if(this.dataset.tried!=='2'){this.dataset.tried='2';this.src='logo.jpg';}else{this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='';}">
      <i style="display: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><path d="M15 6h-3l-3 6.5h6l2-3.5h3"></path><path d="M9 12.5l-3.5 5"></path><path d="M18.5 14v3.5"></path></svg></i>
      <span class="logo-text">MotoCare</span>
    </div>
    <button
      type="button"
      id="btn-sidebar-toggle"
      class="btn-sidebar-toggle"
      onclick="handleSidebarToggleClick()"
      title="Close menu"
      aria-label="Close menu"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  <div class="app-nav-scroll">
    <div class="nl" id="nav-label" data-group-head="primary">
      <span class="app-group-label">Primary navigation</span>
      <span class="app-chevron" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </div>
    <nav id="nav"></nav>
    <div class="nl" id="admin-nav-label" data-group-head="admin" style="display: none;">
      <span class="app-group-label">Administration &amp; support</span>
      <span class="app-chevron" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </div>
    <nav id="admin-nav" style="display: none;"></nav>
  </div>

  <div id="app-drawer-footer" class="app-drawer-footer">
    <!-- TESTING ONLY. Remove or restrict when real permissions are added. -->
    <div id="sidebar-account-switcher" class="sidebar-account-switcher">
      <div class="sidebar-account-wrap">
        <button type="button" class="btn-switch-account" id="btn-switch-account" onclick="toggleAccountSwitcher()" onkeydown="handleAccountSwitcherKeydown(event)" aria-expanded="false" aria-haspopup="listbox" title="Switch account" aria-label="Switch account">
          <span class="btn-switch-account-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <polyline points="17 11 19 13 23 9"></polyline>
            </svg>
          </span>
          <span class="btn-switch-account-label">Switch account</span>
          <svg class="btn-switch-account-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>
    </div>
    <!-- /TESTING ONLY 12-->

    <div class="me" id="sidebar-user">
      <div class="av" id="user-av" title="User avatar">SA</div>
      <div class="me-info">
        <b id="user-name">System Admin</b>
        <span id="user-role">System Admin</span>
      </div>
      <button type="button" class="btn-logout" onclick="logout()" title="Log out" aria-label="Log out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>
</aside>
<div id="sidebar-account-popup" class="sidebar-account-popup" role="listbox" style="display: none;" onkeydown="handleAccountSwitcherKeydown(event)"></div>
<main id="main"></main>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="rec-ov" id="rec-ov" role="dialog" aria-modal="true" aria-labelledby="rec-title" tabindex="-1"><div class="rec-md" id="rec-md"></div></div>
<div class="insp-ov" id="insp-ov" role="dialog" aria-modal="true" aria-labelledby="insp-modal-title" tabindex="-1"><div class="insp-md" id="insp-md"></div></div>
<div class="rcpt-ov" id="rcpt-ov" role="dialog" aria-modal="true" aria-labelledby="rcpt-modal-title" tabindex="-1"><div class="rcpt-md" id="rcpt-md"></div></div>
<div class="insp-ov" id="access-ov" role="dialog" aria-modal="true" aria-labelledby="access-modal-title" tabindex="-1"><div class="insp-md" id="access-md" style="max-width:520px"></div></div>
<div class="insp-ov" id="pos-void-ov" role="dialog" aria-modal="true" aria-labelledby="pos-void-modal-title" tabindex="-1"><div class="insp-md" id="pos-void-md" style="max-width:440px"></div></div>

<script src="motorcycleModels.js"></script>
<script src="demoData.js"></script>
<script src="./app.js"></script>
</body>
</html>
